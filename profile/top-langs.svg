<svg xmlns="http://www.w3.org/2000/svg" width="440" height="216"
     viewBox="0 0 440 216" role="img" aria-label="Most Used Languages">
  <title>Most Used Languages</title>
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    
<clipPath id="bar">
  <rect x="24" y="56" width="392" height="10" rx="5.0"/>
</clipPath>

  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: url(#tg); }
    .name { font-size: 13px; fill: #c0caf5; }
    .pct { font-size: 13px; fill: #565f89; }
    
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
    .fade { animation: fade .5s ease-out both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .grow, .fade { animation: none; } }
    
    
  </style>
  <rect x=".5" y=".5" width="439" height="215" rx="10" fill="#1a1b26" stroke="#2f334d"/>
  <text class="title" x="24" y="38">Most Used Languages</text>
  
<g clip-path="url(#bar)">
  <g class="grow">
    
    <rect x="24.0" y="56" width="158.32" height="10" fill="#3178c6" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="182.32" y="56" width="134.05" height="10" fill="#3572A5" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="316.37" y="56" width="39.42" height="10" fill="#f1e05a" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="355.79" y="56" width="15.86" height="10" fill="#e34c26" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="371.66" y="56" width="15.49" height="10" fill="#00ADD8" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="387.14" y="56" width="14.9" height="10" fill="#663399" stroke="#1a1b26" stroke-width="1.5"/>
    
    <rect x="402.04" y="56" width="13.96" height="10" fill="#8b949e" stroke="#1a1b26" stroke-width="1.5"/>
    
  </g>
</g>

<g class="fade" style="animation-delay: 300ms">
  <circle cx="29.0" cy="92" r="5" fill="#3178c6"/>
  <text class="name" x="42.0" y="96">TypeScript</text>
  <text class="pct" x="204.0" y="96" text-anchor="end">40.4%</text>
</g>

<g class="fade" style="animation-delay: 360ms">
  <circle cx="225.0" cy="92" r="5" fill="#3572A5"/>
  <text class="name" x="238.0" y="96">Python</text>
  <text class="pct" x="400.0" y="96" text-anchor="end">34.2%</text>
</g>

<g class="fade" style="animation-delay: 420ms">
  <circle cx="29.0" cy="118" r="5" fill="#f1e05a"/>
  <text class="name" x="42.0" y="122">JavaScript</text>
  <text class="pct" x="204.0" y="122" text-anchor="end">10.1%</text>
</g>

<g class="fade" style="animation-delay: 480ms">
  <circle cx="225.0" cy="118" r="5" fill="#e34c26"/>
  <text class="name" x="238.0" y="122">HTML</text>
  <text class="pct" x="400.0" y="122" text-anchor="end">4.0%</text>
</g>

<g class="fade" style="animation-delay: 540ms">
  <circle cx="29.0" cy="144" r="5" fill="#00ADD8"/>
  <text class="name" x="42.0" y="148">Go</text>
  <text class="pct" x="204.0" y="148" text-anchor="end">4.0%</text>
</g>

<g class="fade" style="animation-delay: 600ms">
  <circle cx="225.0" cy="144" r="5" fill="#663399"/>
  <text class="name" x="238.0" y="148">CSS</text>
  <text class="pct" x="400.0" y="148" text-anchor="end">3.8%</text>
</g>

<g class="fade" style="animation-delay: 660ms">
  <circle cx="29.0" cy="170" r="5" fill="#8b949e"/>
  <text class="name" x="42.0" y="174">Other</text>
  <text class="pct" x="204.0" y="174" text-anchor="end">3.6%</text>
</g>


</svg>